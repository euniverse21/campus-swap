# Runs on every push to main and on every pull request:
# builds the API, runs all tests (including PostgreSQL tests in Docker), then lints and builds the frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore CampusSwap.slnx

      - name: Build
        run: dotnet build CampusSwap.slnx --no-restore --configuration Release

      # Testcontainers starts a real PostgreSQL in Docker (available on GitHub's Ubuntu runners)
      - name: Test
        run: dotnet test CampusSwap.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
